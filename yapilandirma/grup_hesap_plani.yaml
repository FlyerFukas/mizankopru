  - {kod: "7020", ad: "Faiz gideri",                   tur: G, yon: 1,  kalem: "Finansal gelir/gider"}
  - {kod: "7030", ad: "Kur farkı geliri/gideri, net",  tur: G, yon: 1,  kalem: "Finansal gelir/gider"}
  - {kod: "8010", ad: "Kurumlar vergisi gideri",       tur: G, yon: 1,  kalem: "Vergi"}

  # --- ASKI ---
  # Grup planına eşlenemeyen yerel hesaplar buraya düşer. Satırı ATMAK yerine
  # askıya almak, tutarın kaybolmamasını ve bilançonun denk kalmasını sağlar.
  # Askıda bakiye varken kapanış imzalanmaz — K09 kritik önemde.
  # tur: B seçildi, yani kapanış kuruyla çevrilir; eşlenmemiş hesabın gerçek
  # türü bilinmediği için bu muhafazakâr bir varsayımdır, düzeltilmesi gerekir.
  - {kod: "9999", ad: "ASKIDA — grup planına eşlenmemiş", tur: B, yon: 1,  parasal: true, kalem: "Askı", aski: true}

# Gelir tablosu sunum düzeni — pano ve Excel bu sırayı kullanır.
# Bakiyeler "borç - alacak" olduğu için gelir hesapları negatif gelir;
# sunumda işaret ters çevrilir (bkz. src/sema.py → sunum_isareti).
gelir_tablosu_duzeni:
  - {ad: "Hasılat",              tip: toplam,  kalemler: ["Hasılat"]}
  - {ad: "Satışların maliyeti",  tip: toplam,  kalemler: ["Satışların maliyeti"]}
  - {ad: "BRÜT KÂR",             tip: ara_toplam, bilesenler: ["Hasılat", "Satışların maliyeti"]}
  - {ad: "Faaliyet giderleri",   tip: toplam,  kalemler: ["Faaliyet giderleri"]}
  - {ad: "FAALİYET KÂRI",        tip: ara_toplam, bilesenler: ["BRÜT KÂR", "Faaliyet giderleri"]}
  - {ad: "FAVÖK",                tip: ozel,    aciklama: "Faaliyet kârı + amortisman"}
  - {ad: "Finansal gelir/gider", tip: toplam,  kalemler: ["Finansal gelir/gider"]}
  - {ad: "VERGİ ÖNCESİ KÂR",     tip: ara_toplam, bilesenler: ["FAALİYET KÂRI", "Finansal gelir/gider"]}
  - {ad: "Vergi",                tip: toplam,  kalemler: ["Vergi"]}
  - {ad: "NET KÂR",              tip: ara_toplam, bilesenler: ["VERGİ ÖNCESİ KÂR", "Vergi"]}

bilanco_duzeni:
