  - {kod: "1530", ad: "Maddi olmayan duran varlıklar", tur: B, yon: 1,  parasal: false, kalem: "Duran varlıklar"}

  # --- YÜKÜMLÜLÜKLER ---
  - {kod: "2010", ad: "Ticari borçlar",                tur: B, yon: -1, parasal: true,  kalem: "Kısa vadeli yükümlülükler"}
  - {kod: "2015", ad: "Grup içi borçlar",              tur: B, yon: -1, parasal: true,  kalem: "Kısa vadeli yükümlülükler", elimine: true}
  - {kod: "2020", ad: "Finansal borçlar",              tur: B, yon: -1, parasal: true,  kalem: "Kısa vadeli yükümlülükler"}
  - {kod: "2030", ad: "Personel borçları",             tur: B, yon: -1, parasal: true,  kalem: "Kısa vadeli yükümlülükler"}
  - {kod: "2040", ad: "Vergi yükümlülükleri",          tur: B, yon: -1, parasal: true,  kalem: "Kısa vadeli yükümlülükler"}
  - {kod: "2510", ad: "Uzun vadeli finansal borçlar",  tur: B, yon: -1, parasal: true,  kalem: "Uzun vadeli yükümlülükler"}
  - {kod: "2520", ad: "Kıdem tazminatı karşılığı",     tur: B, yon: -1, parasal: false, kalem: "Uzun vadeli yükümlülükler"}

  # --- ÖZKAYNAK ---
  - {kod: "3010", ad: "Ödenmiş sermaye",               tur: B, yon: -1, parasal: false, kalem: "Özkaynaklar"}
  - {kod: "3020", ad: "Sermaye yedekleri",             tur: B, yon: -1, parasal: false, kalem: "Özkaynaklar"}
