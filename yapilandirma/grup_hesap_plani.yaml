  # --- GELİR TABLOSU ---
  - {kod: "4010", ad: "Yurt içi satışlar",             tur: G, yon: -1, kalem: "Hasılat"}
  - {kod: "4020", ad: "Yurt dışı satışlar",            tur: G, yon: -1, kalem: "Hasılat"}
  - {kod: "4025", ad: "Grup içi satışlar",             tur: G, yon: -1, kalem: "Hasılat", elimine: true}
  - {kod: "4090", ad: "Satış iskonto ve iadeleri",     tur: G, yon: 1,  kalem: "Hasılat"}
  - {kod: "5010", ad: "Satılan malın maliyeti",        tur: G, yon: 1,  kalem: "Satışların maliyeti"}
  - {kod: "5025", ad: "Grup içi alımların maliyeti",   tur: G, yon: 1,  kalem: "Satışların maliyeti", elimine: true}
