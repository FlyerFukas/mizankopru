  - {ad: "Duran varlıklar",              kalemler: ["Duran varlıklar"]}
  - {ad: "TOPLAM VARLIKLAR",             tip: ara_toplam, bilesenler: ["Dönen varlıklar", "Duran varlıklar"]}
  - {ad: "Kısa vadeli yükümlülükler",    kalemler: ["Kısa vadeli yükümlülükler"]}
  - {ad: "Uzun vadeli yükümlülükler",    kalemler: ["Uzun vadeli yükümlülükler"]}
  - {ad: "Özkaynaklar",                  kalemler: ["Özkaynaklar"]}
  - {ad: "TOPLAM KAYNAKLAR",             tip: ara_toplam, bilesenler: ["Kısa vadeli yükümlülükler", "Uzun vadeli yükümlülükler", "Özkaynaklar"]}
  - {ad: "Askı",                         kalemler: ["Askı"], uyari: "Sıfır olmalı; değilse kapanış imzalanamaz"}
