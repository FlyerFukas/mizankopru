# ============================================================
# GRUP HESAP PLANI (IFRS sunum bazlı)
#
# tur      : B = Bilanço, G = Gelir tablosu
# yon      : 1 = normalde borç bakiye, -1 = normalde alacak bakiye
#            (Bakiye hep "borç - alacak" olarak tutulur; yon sadece
#             sunumda işaretin doğru okunması için.)
# parasal  : IAS 29 (enflasyon muhasebesi) için parasal/parasal olmayan ayrımı — v2
# elimine  : Konsolidasyonda grup içi eliminasyona tabi
# cevrim   : IAS 21 → B kalemleri KAPANIŞ kuru, G kalemleri ORTALAMA kur
# ============================================================

hesaplar:
  # --- VARLIKLAR ---
  - {kod: "1010", ad: "Nakit ve nakit benzerleri",     tur: B, yon: 1,  parasal: true,  kalem: "Dönen varlıklar"}
