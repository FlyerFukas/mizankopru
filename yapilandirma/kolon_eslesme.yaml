# ============================================================
# GİRDİ KOLON EŞLEŞTİRME
#
# ERP'den gelen dosyaların kolon adları → motorun iç şeması.
# Her iç alan için birden çok olası dış ad yazılabilir; ilk eşleşen kullanılır.
# Eşleşme büyük/küçük harf ve baştaki-sondaki boşluk duyarsızdır.
#
# YENİ BİR ERP BAĞLARKEN: kod değil, sadece bu dosya değişir.
# ============================================================

mizan:
