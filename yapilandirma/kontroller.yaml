# ============================================================
# İÇ KONTROL TESTLERİ
#
# Her test: aktif (çalışsın mı), onem (bulgunun ağırlığı), ve kendi eşikleri.
# onem: kritik > yuksek > orta > dusuk
# Yeni bir şirket/politika için eşikleri buradan değiştir, kod değişmez.
# ============================================================

genel:
  # Onay limitleri, şirketin fonksiyonel para biriminde
  onay_limitleri:
    TR01: {para_birimi: TRY, tek_fis_limiti: 2000000}
    TR02: {para_birimi: TRY, tek_fis_limiti: 1000000}
    DE01: {para_birimi: EUR, tek_fis_limiti: 50000}
    UK01: {para_birimi: GBP, tek_fis_limiti: 40000}
  # Mesai tanımı, bu aralık dışı kayıtlar işaretlenir
  mesai_saatleri: {baslangic: "07:00", bitis: "20:00"}
  calisma_gunleri: [1, 2, 3, 4, 5]   # 1=Pazartesi ... 7=Pazar

testler:

  - kod: "K01"
    ad: "Bilanço denkliği"
    aciklama: "Her şirket-dönem için borç toplamı alacak toplamına eşit olmalı."
    neden_onemli: "Eşit değilse mizan eksik ya da bozuk gelmiştir; üstüne kurulan her rakam yanlıştır."
    # Bu test olmadan çalışamaz; veri yüklenmemişse ATLANIR
    # ve raporda "veri yok" diye gösterilir, sessizce geçilmez.
    gerekli_veri: "mizan"
    aktif: true
    onem: kritik
    esikler:
      tolerans: 0.01          # yerel para biriminde mutlak tolerans

  - kod: "K02"
    ad: "Mükerrer fiş"
    aciklama: "Aynı tarih, tutar ve hesap ikilisine sahip birden çok fiş."
    neden_onemli: "Çift ödeme ve çift gider kaydının klasik göstergesi."
    # Bu test olmadan çalışamaz; veri yüklenmemişse ATLANIR
    # ve raporda "veri yok" diye gösterilir, sessizce geçilmez.
    gerekli_veri: "yevmiye"
    aktif: true
    onem: yuksek
    esikler:
      asgari_tutar: 1000      # bu tutarın altındakileri gürültü say
      gun_penceresi: 3        # kaç gün içindeki tekrarlar mükerrer sayılsın

  - kod: "K03"
    ad: "Dönem kayması (cut-off)"
    aciklama: "Belge tarihi dönem dışında olduğu hâlde o döneme kaydedilmiş fişler."
    neden_onemli: "Dönemsellik ilkesi ihlali; kârı dönemler arası kaydırmanın en yaygın yolu."
    # Bu test olmadan çalışamaz; veri yüklenmemişse ATLANIR
    # ve raporda "veri yok" diye gösterilir, sessizce geçilmez.
    gerekli_veri: "yevmiye"
    aktif: true
    onem: yuksek
    esikler:
      asgari_tutar: 5000
      tolerans_gun: 0         # dönem dışı her gün işaretlensin

  - kod: "K04"
    ad: "Mesai dışı kayıt"
    aciklama: "Hafta sonu veya mesai saatleri dışında girilmiş yüksek tutarlı fişler."
    neden_onemli: "Gözetimin en zayıf olduğu anlar; usulsüzlük literatüründe kırmızı bayrak."
    # Bu test olmadan çalışamaz; veri yüklenmemişse ATLANIR
    # ve raporda "veri yok" diye gösterilir, sessizce geçilmez.
    gerekli_veri: "yevmiye"
    aktif: true
    onem: orta
    esikler:
      asgari_tutar: 100000    # sunum para biriminde (EUR)

  - kod: "K05"
    ad: "Yetki limiti aşımı"
    aciklama: "Tek bir fişin şirketin onay limitini aşması."
    neden_onemli: "Yetkilendirme kontrolünün atlanması; SOX/iç kontrol bulgusu."
    # Bu test olmadan çalışamaz; veri yüklenmemişse ATLANIR
    # ve raporda "veri yok" diye gösterilir, sessizce geçilmez.
    gerekli_veri: "yevmiye"
    aktif: true
    onem: kritik
    esikler:
      # Onay limiti bir HARCAMA YETKİSİDİR. Müşteri tahsilatına, satış
      # faturasına, rutin stok alımına ya da bordro kaydına uygulanmaz:
      # onlar kendi süreçleriyle (sipariş, sözleşme, bordro) yönetilir.
      # Kapsam dışı bırakılmazsa test binlerce yanlış pozitif üretir ve
      # okunmaz hâle gelir.
      kapsam_grup_hesaplari: ["6020", "6030", "6040", "6060", "1510", "1530"]
                            # kira, pazarlama, genel yönetim, danışmanlık, yatırım
      # Açılış/devir kayıtları ve otomatik sistem kayıtları bir kişinin
      # harcama yetkisiyle girilmez; onay limiti onlara uygulanmaz.
      # (Bu istisnayı yapay zekâ triyajı önerdi, 2026-09-18.)
      haric_kullanicilar: ["SISTEM", "SYSTEM"]

  - kod: "K06"
    ad: "Limit parçalama (splitting)"
    aciklama: "Aynı gün, aynı kullanıcı ve hesapta, onay limitinin hemen altında birden çok fiş."
    neden_onemli: "Limit aşımından kaçınmak için işlemi bölmek, aşımın kendisinden daha ciddi bir sinyal."
    # Bu test olmadan çalışamaz; veri yüklenmemişse ATLANIR
    # ve raporda "veri yok" diye gösterilir, sessizce geçilmez.
    gerekli_veri: "yevmiye"
    aktif: true
    onem: kritik
    esikler:
      limit_orani_alt: 0.70   # limitin %70-100 bandındaki fişlere bak
      asgari_adet: 2          # aynı gün kaç tane olursa şüpheli

  - kod: "K07"
    ad: "Benford ilk rakam testi"
    aciklama: "Tutarların ilk rakam dağılımının Benford yasasından ki-kare sapması."
    neden_onemli: "Elle uydurulmuş tutarlar doğal dağılımı bozar; toplu veride hızlı tarama aracı."
    # Bu test olmadan çalışamaz; veri yüklenmemişse ATLANIR
    # ve raporda "veri yok" diye gösterilir, sessizce geçilmez.
    gerekli_veri: "yevmiye"
    aktif: true
    onem: orta
    esikler:
      asgari_gozlem: 100      # bu sayının altında test güvenilmez, çalıştırma
      ki_kare_kritik: 20.09   # 8 serbestlik derecesi, %99 anlamlılık

  - kod: "K08"
    ad: "Grup içi eliminasyon farkı"
    aciklama: "A şirketinin B'den alacağı ile B'nin A'ya borcunun tutmaması."
    neden_onemli: "Konsolide bilançoyu doğrudan şişirir; kapanışın en çok vakit alan kalemi."
    # Bu test olmadan çalışamaz; veri yüklenmemişse ATLANIR
    # ve raporda "veri yok" diye gösterilir, sessizce geçilmez.
    gerekli_veri: "grup_ici"
    aktif: true
    onem: kritik
    esikler:
      tolerans_mutlak: 1000   # EUR
      tolerans_oran: 0.005    # %0,5

  - kod: "K09"
    ad: "Eşleşmeyen hesap"
    aciklama: "Yerel mizanda olup grup hesap planı eşleme tablosunda karşılığı bulunmayan hesap."
    neden_onemli: "Eşleşmeyen hesap sessizce konsolidasyon dışı kalır, en tehlikeli hata türü, çünkü tablo yine de denk görünür."
    # Bu test olmadan çalışamaz; veri yüklenmemişse ATLANIR
    # ve raporda "veri yok" diye gösterilir, sessizce geçilmez.
    gerekli_veri: "mizan"
    aktif: true
    onem: kritik
    esikler: {}

  - kod: "K10"
    ad: "Eksik dönem"
    aciklama: "Bir şirketin bir döneminin hiç gelmemiş olması."
    neden_onemli: "Geç kapanış; konsolide tabloda o şirket o ay yok sayılır."
    # Bu test olmadan çalışamaz; veri yüklenmemişse ATLANIR
    # ve raporda "veri yok" diye gösterilir, sessizce geçilmez.
    gerekli_veri: "mizan"
    aktif: true
    onem: kritik
    esikler: {}

  - kod: "K11"
    ad: "Ters bakiye"
    aciklama: "Hesabın normal yönünün tersine bakiye vermesi (ör. gelir hesabında borç bakiye)."
    neden_onemli: "Yanlış hesaba kayıt, eksik iade ya da sınıflandırma hatası göstergesi."
    # Bu test olmadan çalışamaz; veri yüklenmemişse ATLANIR
    # ve raporda "veri yok" diye gösterilir, sessizce geçilmez.
    gerekli_veri: "mizan"
    aktif: true
    onem: orta
    esikler:
      asgari_tutar: 10000     # sunum para biriminde

  - kod: "K12"
    ad: "Yuvarlak tutar yoğunluğu"
    aciklama: "Belirli bir hesap/masraf merkezinde aşırı yuvarlak tutarların payı."
    neden_onemli: "Gerçek ticari işlemler nadiren tam yuvarlaktır; tahmini/uydurma kayıt sinyali."
    # Bu test olmadan çalışamaz; veri yüklenmemişse ATLANIR
    # ve raporda "veri yok" diye gösterilir, sessizce geçilmez.
    gerekli_veri: "yevmiye"
    aktif: true
    onem: dusuk
    esikler:
      yuvarlaklik: 1000       # bu sayının tam katları
      pay_esigi: 0.15         # payı %15'i geçerse işaretle
      asgari_gozlem: 20

  - kod: "K13"
    ad: "Görevler ayrılığı, tek kullanıcı yoğunluğu"
    aciklama: "Bir hesaptaki kayıtların büyük bölümünün tek kullanıcı tarafından girilmiş olması."
    neden_onemli: "Görevler ayrılığı ilkesinin zayıflaması; kontrol ortamı bulgusu."
    # Bu test olmadan çalışamaz; veri yüklenmemişse ATLANIR
    # ve raporda "veri yok" diye gösterilir, sessizce geçilmez.
    gerekli_veri: "yevmiye"
    aktif: true
    onem: orta
    esikler:
      pay_esigi: 0.90
      asgari_gozlem: 30

  - kod: "K14"
    ad: "Büyük bütçe sapması"
    aciklama: "Bütçe-fiili sapmasının hem oransal hem mutlak eşiği aşması."
    neden_onemli: "FP&A'nın açıklama borcu doğduğu eşik; ikisi birden aranır ki küçük kalemler gürültü yapmasın."
    # Bu test olmadan çalışamaz; veri yüklenmemişse ATLANIR
    # ve raporda "veri yok" diye gösterilir, sessizce geçilmez.
    gerekli_veri: "butce"
    aktif: true
    onem: yuksek
    esikler:
      oran_esigi: 0.10        # %10
      mutlak_esik: 100000     # EUR, ikisi de aşılmalı

  # ==================================================================
  # MİZAN TABANLI TESTLER (K15-K24)
  #
  # Yevmiye defteri olmadan da yapılabilen kontroller. Bir kapanışta
  # elde çoğu zaman yalnızca mizan olur; bu testler o durumda denetimin
  # tamamen durmasını engeller.
  #
  # Hepsi Tek Düzen Hesap Planı'na (VUK_TDHP) özgüdür ve yalnızca hesap
  # planı VUK_TDHP olan şirketlerde çalışır. Başka bir plandaki şirket
  # için sessizce geçilmez, ATLANDI olarak raporlanır.
  # ==================================================================

  - kod: "K15"
    ad: "Düzenleyici hesap yönü"
    aciklama: >
      TDHP'de (-) ile biten düzenleyici hesapların (103 Verilen Çekler,
      119 Menkul Kıymet Değer Düşüklüğü, 129 Şüpheli Alacak Karşılığı,
      158 Stok Değer Düşüklüğü, 257/268 Birikmiş Amortisman, 371, 501
      Ödenmemiş Sermaye) bağlı oldukları hesabın tersi yönde bakiye
      vermesi gerekir.
    neden_onemli: >
      Ters yönde bakiye, kaydın yanlış hesaba atıldığını gösterir ve
      varlık toplamını doğrudan şişirir. Mizan yine denk görünür.
    gerekli_veri: mizan
    aktif: true
    onem: yuksek
    esikler:
      asgari_tutar: 1000

  - kod: "K16"
    ad: "Aktif-pasif ve dönem kârı mutabakatı"
    aciklama: >
      Aktif toplamı, pasif toplamı ile dönem net kârının toplamına eşit
      olmalıdır. Mizanda 690/692 kapatılmamışsa fark tam olarak gelir
      tablosu sonucuna eşit çıkar.
    neden_onemli: >
      Fark varsa bilanço ile gelir tablosu birbirini tutmuyordur; hangi
      tarafın yanlış olduğu bilinmeden hiçbir rakam kullanılamaz.
    gerekli_veri: mizan
    aktif: true
    onem: kritik
    esikler:
      tolerans: 1.0

  - kod: "K17"
    ad: "7/A maliyet ve yansıtma denkliği"
    aciklama: >
      7/A seçeneğinde gider yeri hesapları (710-798) yansıtma hesaplarıyla
      kapatılır; grubun net bakiyesi dönem sonunda sıfır olmalıdır.
    neden_onemli: >
      Sıfır değilse maliyet aktarımı yarım kalmıştır: gider ya iki kez
      sayılmış ya da hiç gelir tablosuna geçmemiştir.
    gerekli_veri: mizan
    aktif: true
    onem: yuksek
    esikler:
      tolerans: 1.0

  - kod: "K18"
    ad: "KDV hesapları kapanışı"
    aciklama: >
      Dönem sonunda 191 İndirilecek KDV ve 391 Hesaplanan KDV mahsuplaşıp
      kapanmış, kalan tutar 190 Devreden KDV'ye aktarılmış olmalıdır.
    neden_onemli: >
      191 ya da 391'de bakiye kalması, mizanın KDV beyannamesiyle
      uyuşmadığını gösterir. Vergi incelemesinin ilk baktığı yerlerden.
    gerekli_veri: mizan
    aktif: true
    onem: yuksek
    esikler:
      asgari_tutar: 1000

  - kod: "K19"
    ad: "TTK 376 sermaye kaybı"
    aciklama: >
      Özkaynak toplamı (sermaye + yedekler + geçmiş yıl sonuçları + dönem
      kârı) ödenmiş sermayenin yarısının altına düşmüşse TTK m.376/1
      uyarınca genel kurul toplanmalı; üçte ikisi kaybedilmişse 376/2
      uyarınca sermaye tamamlama veya azaltma zorunludur.
    neden_onemli: >
      Yasal bir yükümlülüktür ve süreye bağlıdır. Kapanışta fark
      edilmezse yönetim organının sorumluluğu doğar.
    gerekli_veri: mizan
    aktif: true
    onem: kritik
    esikler:
      yarim_esik: 0.50
      ucte_iki_esik: 0.3333

  - kod: "K20"
    ad: "Ortaklarla ilişkili işlem yoğunluğu"
    aciklama: >
      131/231 Ortaklardan Alacaklar ve 331/431 Ortaklara Borçlar
      hesaplarının bilanço toplamı içindeki payı.
    neden_onemli: >
      Yüksek pay, örtülü sermaye (KVK m.12) ve transfer fiyatlandırması
      (KVK m.13) riskine işaret eder; ayrıca adat faizi hesaplanması
      gerekebilir.
    gerekli_veri: mizan
    aktif: true
    onem: yuksek
    esikler:
      pay_esigi: 0.10

  - kod: "K21"
    ad: "Kasa bakiyesi makullüğü"
    aciklama: >
      100 Kasa hesabının yıllık hasılata oranı ve mutlak büyüklüğü.
    neden_onemli: >
      Fiilen kasada bulunması mümkün olmayan tutarlar, ortaklara örtülü
      olarak verilmiş sayılır ve adat faizi üzerinden vergilendirilir.
      Türkiye'de en sık rastlanan inceleme bulgularından biridir.
    gerekli_veri: mizan
    aktif: true
    onem: orta
    esikler:
      hasilat_orani: 0.05
      asgari_tutar: 100000

  - kod: "K22"
    ad: "Likidite ve kaldıraç eşikleri"
    aciklama: >
      Cari oran (dönen varlık / kısa vadeli yükümlülük), asit-test oranı
      ve borç/özkaynak oranı eşik dışına çıkmışsa uyarı.
    neden_onemli: >
      Kapanışın imzalanmasını engellemez ama finansman ihtiyacının
      kapanış anında görülmesini sağlar. FP&A'nın erken uyarı görevi.
    gerekli_veri: mizan
    aktif: true
    onem: orta
    esikler:
      cari_oran_alt: 1.00
      asit_test_alt: 0.70
      borc_ozkaynak_ust: 3.00

  - kod: "K23"
    ad: "Amortisman tutarlılığı"
    aciklama: >
      Birikmiş amortismanın (257, 268, 299) maddi ve maddi olmayan duran
      varlık brüt tutarına oranı. Oran %100'ü aşamaz; sıfır olması da
      amortisman ayrılmadığını gösterir.
    neden_onemli: >
      Amortisman eksikse kâr ve varlık birlikte şişer; %100'ü aşıyorsa
      sabit kıymet defteri ile mizan birbirini tutmuyordur.
    gerekli_veri: mizan
    aktif: true
    onem: orta
    esikler:
      ust_oran: 1.00
      asgari_mdv: 50000

  - kod: "K24"
    ad: "Alacak ve stok devir süresi"
    aciklama: >
      Alacak devir günü (120+121 / hasılat x 365) ve stok devir günü
      (15x / satılan malın maliyeti x 365).
    neden_onemli: >
      Uzayan alacak süresi tahsil edilemeyen alacağa ve eksik şüpheli
      alacak karşılığına; uzayan stok süresi değer düşüklüğü
      ayrılmamasına işaret eder. İkisi de kârı olduğundan yüksek gösterir.
    gerekli_veri: mizan
    aktif: true
    onem: orta
    esikler:
      alacak_gun_ust: 120
      stok_gun_ust: 120
